<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube 双语字幕翻译</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>YouTube 双语字幕</h1>
      <span class="ver">v0.7.20</span>
      <button id="openPlayerBtn" title="本地视频双语字幕播放器" style="margin-left:auto;padding:3px 9px;font-size:11px;">🎬 本地视频</button>
    </header>

    <div id="fatal" class="fatal" style="display: none"></div>

    <section>
      <label class="row">
        <span>启用翻译</span>
        <input type="checkbox" id="enabled" class="switch" />
      </label>
      <label class="row">
        <span>双语显示（原文 + 译文）</span>
        <input type="checkbox" id="bilingual" class="switch" />
      </label>
      <label class="row">
        <span>隐藏 YouTube 原生字幕</span>
        <input type="checkbox" id="hideNative" class="switch" />
      </label>
      <label class="row">
        <span title="YouTube 自动字幕每条只有半句话，逐条翻译会得到断头断尾的译文。开启后先拼成完整句再翻。">
          智能合并字幕成完整句
        </span>
        <input type="checkbox" id="mergeBySentence" class="switch" />
      </label>
      <label class="row">
        <span title="翻译仍按整句进行（保证译文通顺），但显示时只显示「人已经说到」的那部分，不提前剧透后面的内容。">
          逐字跟随语音显示
        </span>
        <input type="checkbox" id="revealAsSpoken" class="switch" />
      </label>
      <label class="row">
        <span title="YouTube 的自动字幕是滚动窗口式的，会用 >> 标记新增内容。开启后只显示最后一个 >> 之后的新句子，避免整条滚动历史挤成一长串。">
          只显示最新字幕片段
        </span>
        <input type="checkbox" id="domKeepLatest" class="switch" />
      </label>
    </section>

    <section>
      <div class="title">目标语言</div>
      <select id="targetLang"></select>

      <div class="title">原字幕语言</div>
      <select id="trackLang"></select>
    </section>

    <section>
      <div class="title">翻译引擎</div>
      <select id="translator">
        <option value="ai">AI 翻译（Google 秒出打底 + 本地模型逐步覆盖，推荐）</option>
        <option value="google">Google 免费端点（秒回，质量一般）</option>
      </select>
      <p class="note">
        AI 引擎需要先启动本地桥接服务：<br />
        第一次装好：双击 <b>bridge\install-autostart.bat</b> 一次，以后开机自动在后台运行；<br />
        临时启动：<b>bridge\start-bridge.bat</b><br />
        选 <code>agent2/…</code> 走本机 Agent2API 网关（127.0.0.1:3065），智能模式哪个能用用哪个；<br />
        选 <code>codebuddy/…</code> 时，桥会自动改调本机 CodeBuddy CLI（需已登录）。
      </p>

      <div id="aiBox" class="ai-box">
        <label class="col">
          <span>接口地址 Base URL</span>
          <input type="text" id="aiBaseUrl" placeholder="http://localhost:8788/v1" />
        </label>
        <label class="col">
          <span>API Key</span>
          <input type="password" id="aiApiKey" placeholder="留空即可（桥不校验）" />
        </label>
        <label class="col">
          <span>模型</span>
          <select id="aiModel">
            <optgroup label="Agent2 网关 · 本机 Agent2API（:3065）">
              <option value="agent2/auto">智能 · 自动选可用模型（推荐）</option>
              <option value="agent2/glm-5.3-flash">glm-5.3-flash　最快 3~8s　1M/128K</option>
              <option value="agent2/deepseek-v4.1-flash">deepseek-v4.1-flash　中文最地道　~60s</option>
              <option value="agent2/glm-5.3">glm-5.3　1M/64K</option>
              <option value="agent2/deepseek-v4-pro">deepseek-v4-pro　1M/128K</option>
            </optgroup>
            <optgroup label="opencode 免费 · 本机实测可用">
              <option value="opencode/space-bunny-free">space-bunny-free　顶配 1M上下文/512K输出　2.2s</option>
              <option value="opencode/deepseek-v4.1-flash-free">deepseek-v4.1-flash-free　中文最地道　2.8s</option>
              <option value="opencode/nemotron-3-ultra-free">nemotron-3-ultra-free　1M上下文　7.1s</option>
              <option value="opencode/longcat-2.5-preview-free">longcat-2.5-preview-free　1M上下文　7.7s</option>
              <option value="opencode/step-5-preview-free">step-5-preview-free　1M上下文　14.9s</option>
              <option value="opencode/mimo-v2.6-flash-free">mimo-v2.6-flash-free　200K上下文　6.8s</option>
              <option value="opencode/nemotron-3.5-lightning-free">nemotron-3.5-lightning-free　262K/262K　30.7s</option>
              <option value="opencode/big-pickle">big-pickle　旧默认　29.1s</option>
            </optgroup>
            <optgroup label="CodeBuddy（走本机 CodeBuddy CLI，需已登录）">
              <option value="codebuddy/deepseek-v4.1-flash">codebuddy/deepseek-v4.1-flash</option>
            </optgroup>
            <option value="custom">手动输入…</option>
          </select>
        </label>
        <label class="col" id="aiModelCustomWrap" style="display: none">
          <span>自定义模型 ID</span>
          <input type="text" id="aiModelCustom" placeholder="provider/model-id" />
        </label>
      </div>
    </section>

    <section>
      <div class="title">样式微调</div>

      <label class="col">
        <span>字体</span>
        <select id="fontFamily">
          <option value="common">最通用 Arial + 微软雅黑</option>
          <option value="segoe">Segoe UI（Windows 现代）</option>
          <option value="yahei">微软雅黑（中文最工整）</option>
          <option value="songti">Georgia + 宋体（衬线，正式）</option>
          <option value="mono">Consolas 等宽（技术内容）</option>
          <option value="round">Trebuchet MS（圆润）</option>
        </select>
      </label>

      <div class="grid2">
        <div class="col">
          <span>原文字体颜色</span>
          <div class="swatches" id="sw_originalColor"></div>
        </div>
        <div class="col">
          <span>译文字体颜色</span>
          <div class="swatches" id="sw_translatedColor"></div>
        </div>
      </div>

      <div class="grid2">
        <div class="col">
          <span>字幕背景色</span>
          <div class="swatches" id="sw_bgColor"></div>
        </div>
        <label class="col">
          <span>背景不透明度 <b id="bgOpacityVal"></b>%</span>
          <input type="range" id="bgOpacity" min="0" max="100" step="5" />
        </label>
      </div>

      <details class="adv">
        <summary>高级：精确取色</summary>
        <div class="grid2">
          <label class="col">
            <span>原文取色盘</span>
            <input type="color" id="originalColor" />
          </label>
          <label class="col">
            <span>译文取色盘</span>
            <input type="color" id="translatedColor" />
          </label>
        </div>
        <label class="col">
          <span>背景取色盘</span>
          <input type="color" id="bgColor" />
        </label>
      </details>

      <div class="grid2">
        <label class="col">
          <span>原文字号 <b id="originalSizeVal"></b>px</span>
          <input type="range" id="originalSize" min="12" max="40" step="1" />
        </label>
        <label class="col">
          <span>译文字号 <b id="translatedSizeVal"></b>px</span>
          <input type="range" id="translatedSize" min="12" max="48" step="1" />
        </label>
      </div>

      <label class="col">
        <span>整体缩放比例 <b id="fontScaleVal"></b>×</span>
        <input type="range" id="fontScale" min="0.5" max="2" step="0.1" />
      </label>

      <div class="grid2">
        <label class="col">
          <span>背景圆角 <b id="boxRadiusVal"></b>px</span>
          <input type="range" id="boxRadius" min="0" max="24" step="1" />
        </label>
        <label class="col">
          <span>背景内边距 <b id="boxPaddingVal"></b>px</span>
          <input type="range" id="boxPadding" min="0" max="28" step="1" />
        </label>
      </div>

      <label class="col">
        <span>文字描边</span>
        <select id="outline">
          <option value="0">无</option>
          <option value="1">柔和阴影</option>
          <option value="2">强描边（无底色必备）</option>
        </select>
      </label>

      <div class="grid2">
        <label class="col">
          <span title="中文字体没有 500/600 中间字重，选中文字体会被浏览器合成加粗（笔画变粗发毛）。建议保持常规。">原文字重</span>
          <select id="originalWeight">
            <option value="400">常规（推荐）</option>
            <option value="700">加粗</option>
          </select>
        </label>
        <label class="col">
          <span title="同上：中文只用 400 / 700，避免伪粗体。">译文字重</span>
          <select id="translatedWeight">
            <option value="400">常规（推荐）</option>
            <option value="700">加粗</option>
          </select>
        </label>
      </div>
    </section>

    <section>
      <div class="title">导出字幕文件</div>
      <div class="grid2">
        <label class="col">
          <span>格式</span>
          <select id="exportFormat">
            <option value="srt">SRT 字幕</option>
            <option value="vtt">VTT 字幕</option>
            <option value="txt">纯文本 TXT</option>
          </select>
        </label>
        <label class="col">
          <span>内容</span>
          <select id="exportMode">
            <option value="bilingual">双语（原文+译文）</option>
            <option value="translation">仅译文</option>
            <option value="original">仅原文</option>
          </select>
        </label>
      </div>
      <button id="exportBtn" class="primary" style="width: 100%">导出当前视频字幕</button>
      <span id="exportMsg" class="saved" style="display: block; text-align: center; margin-top: 6px"></span>
    </section>

    <section>
      <div class="title">诊断</div>
      <button id="testBtn" style="width: 100%">测试翻译（用当前引擎翻译一句话）</button>
      <span id="testMsg" class="saved" style="display: block; text-align: center; margin-top: 6px"></span>
      <button id="statusBtn" style="width: 100%; margin-top: 6px">检查当前页字幕状态</button>
      <span id="statusMsg" class="saved" style="display: block; text-align: center; margin-top: 6px"></span>
    </section>

    <footer>
      <button id="reset">恢复默认</button>
      <span id="saved" class="saved"></span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
